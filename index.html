  <script type="text/markdown" id="doc-how">
# How the lead finder works

The lead finder searches Google Maps through **your** Outscraper account, then ranks every business by how much an AI voice agent would help it. Each lead comes with plain-English reasons, which double as your opening line.

## What it searches

Every business type in your profile, in every city or area in your profile. Two types in three cities is six searches. **Results per search** sets how many places each search returns, and **Max places per run** stops the run once that many are pulled, so a run never costs more than you planned.

## How a lead is scored (0 to 100)

| Signal | Default weight | What earns it |
|---|---|---|
| Business type | 35 | Urgent trades (plumber, HVAC, locksmith, garage door, roofing, pest control) score highest, then appointment businesses (dentist, chiropractor, med spa, vet, auto repair, law firm). Other types score low. |
| Call volume | 25 | More Google reviews usually means a busier phone. About 300 reviews earns the full amount. |
| After-hours gap | 20 | Closed weekends, closed some weekdays, or closing by 6 PM. Open 24 hours earns nothing. |
| No online booking | 10 | No booking link on the listing, so every booking is a call. |
| Owner verified | 10 | A claimed listing, so a decision-maker is reachable. |

Two hard rules sit on top: **no phone number scores 0**, and a **permanently closed** business keeps only 20% of its score. A name that shows up 3 or more times is flagged as a **likely chain** and hidden by default.

You can change the weights in **Your profile > Scoring weights**. Any numbers work; they're scaled to 100.

## What it costs

Outscraper gives 500 places free each month, then charges about $3 per 1,000. The finder shows the most a run can cost before you start. It never uses Outscraper's paid add-ons (like email finding).

## What you get

A ranked list with phone, area, reviews and the reasons for each score, and a **CSV** for your spreadsheet or CRM. Your last results stay on your device until you select **Clear results**.

  <script type="text/markdown" id="doc-privacy">
# Your keys and data

**Short version:** your Outscraper key and your results stay on your device. Searches go straight from your browser to Outscraper and bill to your account.

## Where things live

| Thing | Where it's kept | Who can see it |
|---|---|---|
| Your Outscraper key | Your browser on your device (or just the open tab, if **Remember** is off) | You and Outscraper |
| Your profile | Your browser on your device | You, plus anyone you send the export to |
| Your results | Your browser, until you select **Clear results** | You |
| Your answers to our questions | The email you send us | You and Hirobius |
| Your portal password | Only a scrambled hash of it, on this site | Nobody, not even Hirobius. Change it any time at /password |

## What this site's server sees

Only that the pages were loaded. The lead finder talks to Outscraper directly from your browser, and the page is locked down so it can only send data to Outscraper. Your key never reaches this site's server or Hirobius.

Like any website, this site runs code that Hirobius wrote. You can read all of it in the tool download. If you want complete separation, run the command-line tool on your own computer, or ask for your own hosted copy on your own accounts (question 9).

## Good habits

- On a shared computer, turn **Remember on this device** off, or select **Forget key** when you're done.
- Never paste a key into an email or an AI chat. If you do, make a new key and delete the old one.
- This portal is behind a password. Don't share it; ask us if someone else on your team needs access.

  <script type="text/markdown" id="doc-responsible">
# Using leads responsibly

The lead finder gives you a list. How you contact people is on you, so here are the basics. This is not legal advice; check the rules where you sell.

## The data is unverified

Listings come from Google Maps and can be out of date. Check a business is real and open before you reach out, and never use the data for anything but contacting the business about your service.

## Calling and texting

- **Calling businesses yourself** is generally allowed in the US, but check the [National Do Not Call Registry](https://telemarketing.donotcall.gov) rules and your state's rules, some of which are stricter.
- **Texting** needs more care: many states and carriers require consent first.
- **AI voices are robocalls.** The FCC ruled in 2024 that calls using AI-generated voices count as "artificial voice" calls, which need the person's prior consent ([FCC announcement](https://www.fcc.gov/document/fcc-makes-ai-generated-voices-robocalls-illegal)). Don't cold-call prospects with your voice agent. Call as yourself, email, or visit, and demo the agent once they agree.

## Email

Say who you are, include a real address, and honor opt-outs right away (the CAN-SPAM basics).

  <script type="text/markdown" id="doc-custom">
# Getting your custom version

The lead finder you have now works for most voice-agent sellers. Your answers let us tune it to you.

## How it works

1. **You answer the questions.** Select **Copy for AI**, paste it into your assistant, and say "go". It asks one question at a time.
2. **Your assistant writes two things:** an email to Adrian with your answers and a short spec, and a profile file you can import into the lead finder right away.
3. **We write the spec** for your version and confirm it with you.
4. **We build it and hand it over here**, under Updates, with setup steps.

## What we can change

- The business types and areas it searches, and how each is scored.
- Filters: chains, franchises, existing customers, businesses already using an AI receptionist.
- Where leads go: Google Sheets, your CRM (for example GoHighLevel or HubSpot), or a dialer.
- Owner names and emails (an Outscraper paid add-on, on your account).
- Scheduled runs, and your own hosted copy on your own accounts.

Your keys and accounts stay yours the whole way through.
